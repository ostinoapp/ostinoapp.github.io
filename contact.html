<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support - Ostino</title>
    
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, none">
    <meta name="googlebot" content="noindex, nofollow">

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            line-height: 1.6; 
            color: #333; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .contact-card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { 
            font-size: 24px;
            margin-bottom: 10px;
            color: #000;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .email-button {
            display: inline-block;
            background-color: #007AFF; /* Standard iOS Blue */
            color: #ffffff;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .email-button:active {
            background-color: #0056b3;
            transform: scale(0.98);
        }
        .footer-link {
            margin-top: 30px;
            display: block;
            font-size: 14px;
            color: #999;
            text-decoration: none;
        }
        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="contact-card">
    <h1>Contact Support</h1>
    <p>Need help with Ostino? Have a suggestion? We'd love to hear from you.</p>
    
    <a href="mailto:ostinoapp@gmail.com" class="email-button">
        Email Support
    </a>

    <a href="privacy.html" class="footer-link">View Privacy Policy</a>
</div>

</body>
</html>
